# Shop AI assistant — STAGING on the shared staging k3s VPS (same cluster as gvs-staging, separate namespace,
# nothing shared with GVS). Public URL: https://ai.square.al
#
# Deploy with k8s/deploy-staging.sh (it substitutes __IMAGE_TAG__ and __OPENWA_TAG__, creates the Secret, applies this file).
# Do not `kubectl apply -f` this file by hand: the image tag placeholders below are not real tags.
#
# The shop-ai-env Secret is NOT kept in git. It is created from k8s/.env.staging (gitignored; template:
# k8s/staging.env.example) by the deploy script:
#   kubectl -n shop-ai-staging create secret generic shop-ai-env --from-env-file=... --dry-run=client -o yaml \
#     | kubectl apply -f -
#
# WhatsApp (OpenWA gateway, StatefulSet `openwa` below) runs in-cluster, internal only (ClusterIP, no Ingress):
#   app -> http://openwa:2785 (OPENWA_URL), gateway -> http://app.shop-ai-staging.svc.cluster.local/api/webhooks/openwa
#   (OPENWA_WEBHOOK_URL; must be a dotted host: the gateway's @IsUrl() rejects a bare `http://app/...`).
# Image localhost:5000/shop-ai/openwa:__OPENWA_TAG__ (fixed tag = pinned OpenWA commit, see docker/openwa/Dockerfile),
# pushed by deploy-staging.sh unless --skip-openwa. The gateway generates its API key on first boot into
# /app/data/.api-key (no env can fix it): after the first deploy copy it into k8s/.env.staging as OPENWA_API_KEY
#   ssh <vps> sudo -n kubectl -n shop-ai-staging exec openwa-0 -- cat /app/data/.api-key
# and re-run deploy-staging.sh --skip-openwa. A wiped PVC = new key + new QR scan.
# Pair a DEDICATED staging WhatsApp number (Channels page -> Lidh WhatsApp (OpenWA) -> QR), never SunEasy's or GVS's.
# Memory: request 1Gi / limit 2Gi (Chromium) on a shared VPS: check free RAM/disk before the first rollout.
---
apiVersion: v1
kind: Namespace
metadata:
  name: shop-ai-staging
  labels:
    environment: staging

---
# ─── Postgres ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: shop-ai-staging
spec:
  clusterIP: None # headless, governs the StatefulSet; DNS name `postgres` resolves to the pod
  selector:
    app: postgres
  ports:
    - port: 5432

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: shop-ai-staging
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: shop-ai-env
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-ai-env
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: shop-ai-env
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi

---
# ─── App (Next.js standalone, port 4710) ──────────────────────────────────────
# MUST stay at exactly 1 replica with Recreate: background workers (outbox, channel monitors), the SSE event
# bus and the rate limiters all live in-process. Two pods would double-send and split the event stream.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: shop-ai-staging
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: localhost:5000/shop-ai/app:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4710
          envFrom:
            - secretRef:
                name: shop-ai-env
          # The entrypoint runs `prisma migrate deploy` before `node server.js`; the startup probe gives it time.
          startupProbe:
            httpGet:
              path: /login
              port: 4710
            periodSeconds: 5
            failureThreshold: 36 # 3 minutes
          readinessProbe:
            httpGet:
              path: /login
              port: 4710
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /login
              port: 4710
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: shop-ai-staging
spec:
  selector:
    app: app
  ports:
    - port: 80
      targetPort: 4710

---
# ─── Ingress ──────────────────────────────────────────────────────────────────
# DNS: Cloudflare A record ai.square.al -> 157.180.46.100, DNS only (grey cloud), so cert-manager's HTTP-01
# challenge reaches Traefik directly.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-ai-ingress
  namespace: shop-ai-staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
  labels:
    environment: staging
    managed-by: kubectl
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ai.square.al
      secretName: ai-square-al-tls
  rules:
    - host: ai.square.al
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80

---
# ─── OpenWA (unofficial WhatsApp gateway: whatsapp-web.js + Chromium, port 2785) ─
# Spec mirrors SunEasy's production gateway (k8s/services/backend/whatsapp.yaml) and docker-compose.yml.
# MUST stay at 1 replica: a WhatsApp Web session is bound to one Chromium profile on the PVC.
apiVersion: v1
kind: Service
metadata:
  name: openwa
  namespace: shop-ai-staging
spec:
  type: ClusterIP
  selector:
    app: openwa
  ports:
    - name: http
      port: 2785
      targetPort: 2785

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openwa
  namespace: shop-ai-staging
spec:
  serviceName: openwa
  replicas: 1
  selector:
    matchLabels:
      app: openwa
  template:
    metadata:
      labels:
        app: openwa
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        # The image runs as root (no USER); fsGroup 0 keeps the PVC writable.
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openwa
          image: localhost:5000/shop-ai/openwa:__OPENWA_TAG__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              # Chromium adjusts each renderer's OOM score; without it: "Failed to adjust OOM score" and no session.
              add: [SYS_RESOURCE]
          ports:
            - name: http
              containerPort: 2785
          env:
            # production => random API key written to /app/data/.api-key on first boot (API_MASTER_KEY is ignored)
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "2785"
            - name: LOG_LEVEL
              value: info
            - name: ENGINE_TYPE
              value: whatsapp-web.js
            - name: SESSION_DATA_PATH
              value: /app/data/sessions
            - name: PUPPETEER_HEADLESS
              value: "true"
            - name: PUPPETEER_ARGS
              value: --no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu
            - name: STORAGE_TYPE
              value: local
            - name: STORAGE_LOCAL_PATH
              value: /app/data/media
            - name: DATABASE_TYPE
              value: sqlite
            - name: DATABASE_NAME
              value: /app/data/openwa.sqlite
            - name: DATABASE_SYNCHRONIZE
              value: "true"
            - name: WEBHOOK_TIMEOUT
              value: "10000"
            - name: WEBHOOK_MAX_RETRIES
              value: "3"
            - name: WEBHOOK_RETRY_DELAY
              value: "5000"
            - name: PLUGINS_ENABLED
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /app/data # sessions, SQLite (webhooks, API key hash), .api-key, media
            - name: dshm
              mountPath: /dev/shm
          # /api/health is always 200 while the process is up (even with a dead WhatsApp session): it only
          # proves the HTTP server lives. Session health is the app's channel monitor (src/lib/channels/monitor.ts).
          startupProbe:
            httpGet:
              path: /api/health
              port: 2785
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/health
              port: 2785
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 2785
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              # Chromium steadily uses ~800Mi; less headroom made SunEasy's gateway drop in-flight sends.
              memory: 1Gi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: 1500m
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory # the 64Mi default /dev/shm crashes Chromium
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
